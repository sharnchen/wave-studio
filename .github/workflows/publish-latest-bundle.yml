name: Publish Wave Studio latest package
on:
  push:
    branches: [main]
    paths:
      - 'site-source.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[wave-package]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify bundled AI model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 --max-time 900 \
            'https://huggingface.co/Blane187/all_public_uvr_models/resolve/main/Kim_Vocal_2.onnx?download=true' \
            -o /tmp/Kim_Vocal_2.onnx
          echo 'ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b  /tmp/Kim_Vocal_2.onnx' | sha256sum --check
      - name: Verify source payload and install all package files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile, hashlib
          p=pathlib.Path('site-source.tar.xz.b64')
          compressed=base64.b64decode(p.read_text().strip(),validate=True)
          if hashlib.sha256(compressed).hexdigest()!='12790096035017d9bf056561017a03579dc352ba47869354ac2ebc4a84c43aeb':
              raise RuntimeError('Source package checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(compressed))) as tar:
              for member in tar.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise RuntimeError('Unsafe source member: '+member.name)
              tar.extractall('.',filter='data')
          model=pathlib.Path('/tmp/Kim_Vocal_2.onnx')
          pathlib.Path('models').mkdir(exist_ok=True)
          with model.open('rb') as source:
              count=0
              while chunk:=source.read(8*1024*1024):
                  pathlib.Path(f'models/Kim_Vocal_2.part{count:02d}.bin').write_bytes(chunk)
                  count+=1
          if count!=8:raise RuntimeError(f'Expected 8 model fragments, got {count}')
          wasm=pathlib.Path('vendor/ort-wasm-simd-threaded.asyncify.wasm')
          if not wasm.exists():raise RuntimeError('Expected existing vendor WASM asset')
          with wasm.open('rb') as source:
              count=0
              while chunk:=source.read(8*1024*1024):
                  pathlib.Path(f'vendor/ort-runtime.part{count:02d}.bin').write_bytes(chunk)
                  count+=1
          if count!=4:raise RuntimeError(f'Expected 4 WASM fragments, got {count}')
          if hashlib.sha256(wasm.read_bytes()).hexdigest()!='503d17cb7411b79781b9fad1cf0978f03cf06b050c7d399c730e914f473bf549':
              raise RuntimeError('Existing WASM binary does not match bundled runtime')
          print('Wave Studio complete source, AI model and runtime verified')
          PY
      - name: Publish updated website to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Publish latest Wave Studio package [wave-package]'
          git push origin HEAD:main
