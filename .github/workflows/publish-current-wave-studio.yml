name: Publish current Wave Studio
on:
  push:
    paths: ['.github/workflows/publish-current-wave-studio.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify published source and models
        shell: python
        run: |
          import pathlib,hashlib,urllib.request,json
          files=json.loads("{\".nojekyll\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"ai-worker.js\":\"240db0d8979b6e9822357bd0f12880d3f2e9029495b1713727b12bf8d287d09a\",\"playback.js\":\"9e5517d66999ca5219b41689b7310cc667e73bfa1590f21d56fbb592fda89de0\",\"stem-player.js\":\"78fb0bb8a3df644b01b8baefc37807513cf51c0df02365c49f994b03ba212daa\",\"ai-runner.js\":\"7ec8c519dbc037b0fbcd2773af92826647723be92b9cfed11b310142584428b8\",\"model-loader.js\":\"17b31c9c6da4f4dc3ceabe4ebff7966021c01698f21c07677cae4daf44b3e1ec\",\"ai-engine.js\":\"96c4b67c96e53c93d055bb6b506538c293bb6b11a47ccac29c07531ffe208bbb\",\"index.html\":\"d1f06ca21d12fbe889f2f73d03b5b22e1cbe34a04aedc66f877edafc4e284903\",\"ai.js\":\"74c638add23da5ca9d978293dacc5ae8464c1256e00de0444e314151baf98c7e\",\"project.js\":\"5213820568d65fcdcfb25c6ad68dfcce9d9963e6fed036dafb3af4822ef10ce3\",\"project-codec.js\":\"11fc6646fc6693c2eb2fe7838ddbd7d7051bb32eda535df5774be346188499ef\",\"style.css\":\"ebba5895077a83c20878977e29db652cf12cc40e0c1d3d44a78beef5bd58a860\",\"replay-wave.js\":\"ec9d71d19e18856eee6eb67ca45330e1804c725afa97657608c138a8c84d1140\",\"equalizer.js\":\"d834434907071173aa190ad9e02504f23fb014a774bd0e1a07fd0b8b6f954755\",\"replay-store.js\":\"0466f4b8bda967be3b8c26dbd4f071c220f597532e4d1b299237ece189c32923\",\"app.js\":\"5b4f420232dce4d9c9e292229f97f9e9e0d5a4e330e3e2de3ae8181718ab4665\",\"polarity-inference.js\":\"e0ffa03e611bbf5b7c6231bba678d6e6eff56bf06522487ed2db0544746d1454\",\"wake-lock.js\":\"5ae8f73a13efb1ec467a4b1a89287f75c27a655f4d548cc3da343ca885be533c\",\"models/Kim_Vocal_2.part02.bin\":\"a55805d99db5b5a98f4927f1428dae63900e6e2a2d8ec7e6985f68b98dbba384\",\"models/Kim_Vocal_2.part07.bin\":\"fc7037ae57b164356cd5e8ee3616263bb2e8dd7325d9a084887fb2fd0a4b5931\",\"models/Kim_Vocal_2.part00.bin\":\"bd7e1e56bab03ec311af59792f6d0531e6310aa74d8755526e2e11b16b10618d\",\"models/model-manifest.json\":\"204066db0b9249f4119257e21d52baa98dffc68c3383979aafeabf1c9aeb0974\",\"models/Kim_Vocal_2.part01.bin\":\"9a01fbab41cf2c6933e9a2dd8dbb6c2a7fe0b1069461cbb320f83d946949042f\",\"models/SHA256.txt\":\"9e8435760a39a0b9555fea1207e2be5eab63a6462d78a8ddc7498a79e570c956\",\"models/Kim_Vocal_2.part05.bin\":\"f7a9bf95a4f891a4b3419aea1d3182e37797b4bde854490bc665a3c3fbabb0c4\",\"models/Kim_Vocal_2.part04.bin\":\"b31ede8629b608e94d201578bc3c364f075b1131ef9428b50b9d57b116d32a33\",\"models/Kim_Vocal_2.part06.bin\":\"0c9a4152b45108bfb5ebe30d822bb1be1e2fb0beac1d7650d2bc3d93f0d1d0ce\",\"models/Kim_Vocal_2.part03.bin\":\"233d716d48a9ee951bb3e8f35d99d603d2c2c10be3cdfa18bfb4b90efa858d5d\",\"vendor/onnxruntime-web-LICENSE.txt\":\"2f07c72751aed99790b8a4869cf2311df85a860b22ded05fa22803587a48922c\",\"vendor/ort-runtime.part02.bin\":\"7a4eb3ea135895c6e987fb3d2b2e69ee780c2406cda2a067aa22a7244257bebf\",\"vendor/web-audio-separation-LICENSE.txt\":\"0782ac2797a69986ff12044f9cc986b18c11ca1b458aa6cc5171f6c4ee441be0\",\"vendor/ort-wasm-simd-threaded.asyncify.mjs\":\"5d25483158d53d8f34d0e9c06a654d56c8dca4ebdf370ea0982ef11315a00e0e\",\"vendor/ort-runtime.part03.bin\":\"71acf7ddd17a7c71d52a99e2f07d2823dee9d679bedac53ae6abfa537c2a4130\",\"vendor/ort-runtime.part00.bin\":\"80ae25dec608d9a4546d5de5822885b9c32a4ec31d858716e07b3cd31100cdd6\",\"vendor/ort-runtime.part01.bin\":\"b0ff41122a44cf2b4c26c754604dc0262f402bbe8906c41a7576e3388b064ad8\",\"vendor/runtime-manifest.json\":\"f190c217bc493893aa76f4c07b5f5d5e35b4d4f21fba6a9db3f0b931ddcc7b1d\"}")
          for name,expected in files.items():
              p=pathlib.Path('_publish')/name
              p.parent.mkdir(parents=True,exist_ok=True)
              data=urllib.request.urlopen('https://wave-studio-sharn.liesharn.chatgpt.site/'+name,timeout=180).read()
              if hashlib.sha256(data).hexdigest()!=expected: raise RuntimeError('Checksum mismatch: '+name)
              p.write_bytes(data)
          
      - name: Save site files to repository
        run: |
          cp -r _publish/. ./
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python -c 'import pathlib,subprocess; subprocess.run(["git","add","--"]+[str(p.relative_to("_publish")) for p in pathlib.Path("_publish").rglob("*") if p.is_file()],check=True)'
          git diff --cached --quiet || git commit -m "Publish latest Wave Studio with models, EQ and wake lock"
          git push origin HEAD
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
